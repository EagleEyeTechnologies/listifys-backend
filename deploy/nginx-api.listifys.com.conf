# Nginx reverse proxy for listifys-api (HTTP → upgrade with certbot)
# Install: copy to /etc/nginx/conf.d/api.listifys.com.conf
# Then: sudo nginx -t && sudo systemctl reload nginx
# TLS:  sudo certbot --nginx -d api.listifys.com

upstream listifys_api {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.listifys.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://listifys_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO / WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /health/live {
        proxy_pass http://listifys_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
