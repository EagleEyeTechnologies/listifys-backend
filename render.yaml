# Optional Blueprint when this folder is the service root.
# Prefer setting Root Directory = version-1/new-server on the Render dashboard
# and Build = npm install && npm run build, Start = npm start.
# See RENDER.md.

services:
  - type: web
    name: listifys-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
