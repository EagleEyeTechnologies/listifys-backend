# ════════════════════════════════════════════════════════════════
#  Backend PRODUCTION — CI → Docker → ECR → EC2
# ════════════════════════════════════════════════════════════════
#  Trigger:
#    • pull_request → main  → CI only
#    • push/merge   → main  → CI + Build + ECR Push + EC2 Deploy
#    • workflow_dispatch    → manual full deploy
#
#  Secrets (GitHub → Settings → Secrets → Actions):
#    PROD_AWS_ACCESS_KEY_ID
#    PROD_AWS_SECRET_ACCESS_KEY
#    PROD_AWS_REGION                  (optional; default us-east-1)
#    PROD_EC2_HOST
#    PROD_EC2_USERNAME
#    PROD_EC2_SSH_KEY
#    PROD_EC2_ENV_DIR                (optional; default /home/ubuntu/Listifys-prod)
#    ENV_FILE_PRODUCTION             (required for deploy; full .env file contents)
#
#  EC2 prep (once):
#    • Docker installed; deploy user in docker group
# ════════════════════════════════════════════════════════════════

name: Backend Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  AWS_REGION: ${{ secrets.PROD_AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: listifys-backend
  CONTAINER_NAME: listifys-backend-prod
  HOST_PORT: "5001"
  CONTAINER_PORT: "5001"
  EC2_ENV_DIR: ${{ secrets.PROD_EC2_ENV_DIR || '/home/ubuntu/Listifys-prod' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Unit tests
        run: npm run test

  build-and-push:
    name: Build & Push ECR
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      # Only pass tag between jobs. Full image URI can be scrubbed by GitHub
      # if it overlaps secret values (e.g. AWS account id inside ENV_FILE).
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS secrets
        env:
          AWS_ACCESS_KEY_ID_CHECK: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_CHECK: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          if [ -z "$AWS_ACCESS_KEY_ID_CHECK" ]; then
            echo "ERROR: secret PROD_AWS_ACCESS_KEY_ID is missing"
            missing=1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY_CHECK" ]; then
            echo "ERROR: secret PROD_AWS_SECRET_ACCESS_KEY is missing"
            missing=1
          fi
          if [ -z "$AWS_REGION" ]; then
            echo "ERROR: AWS_REGION is empty"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Using AWS region: $AWS_REGION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" 2>/dev/null \
            || aws ecr create-repository \
                 --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true \
                 --encryption-configuration encryptionType=AES256

      - name: Image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if [ -z "$ECR_REGISTRY" ]; then
            echo "ERROR: ECR registry output is empty"
            exit 1
          fi
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          TAG="${GITHUB_SHA::12}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Built image ref length: ${#IMAGE} tag: ${TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy EC2
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          AWS_ACCESS_KEY_ID_CHECK: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_CHECK: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_USER: ${{ secrets.PROD_EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE_PRODUCTION }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          missing=0
          if [ -z "$AWS_ACCESS_KEY_ID_CHECK" ]; then
            echo "ERROR: secret PROD_AWS_ACCESS_KEY_ID is missing"
            missing=1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY_CHECK" ]; then
            echo "ERROR: secret PROD_AWS_SECRET_ACCESS_KEY is missing"
            missing=1
          fi
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: secret PROD_EC2_HOST is missing"
            missing=1
          fi
          if [ -z "$EC2_USER" ]; then
            echo "ERROR: secret PROD_EC2_USERNAME is missing"
            missing=1
          fi
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: secret PROD_EC2_SSH_KEY is missing"
            missing=1
          fi
          if [ -z "$ENV_FILE" ]; then
            echo "ERROR: secret ENV_FILE_PRODUCTION is missing"
            missing=1
          fi
          if [ -z "$TAG" ]; then
            echo "ERROR: tag output from build-and-push is empty"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Deploy tag: $TAG"
          echo "AWS region: $AWS_REGION"
          echo "EC2 env dir: $EC2_ENV_DIR"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [ -z "$ECR_REGISTRY" ]; then
            echo "ERROR: ECR registry output is empty"
            exit 1
          fi
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Resolved image length: ${#IMAGE} tag: ${TAG}"

      - name: Setup SSH
        env:
          EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend container
        env:
          EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_USER: ${{ secrets.PROD_EC2_USERNAME }}
          ENV_DIR: ${{ env.EC2_ENV_DIR }}
          ENV_FILE: ${{ secrets.ENV_FILE_PRODUCTION }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          REGISTRY="${IMAGE%%/*}"

          printf '%s\n' "$ENV_FILE" > /tmp/listifys.env
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" "mkdir -p '${ENV_DIR}'"
          scp -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes \
            /tmp/listifys.env "${EC2_USER}@${EC2_HOST}:${ENV_DIR}/.env"
          rm -f /tmp/listifys.env

          aws ecr get-login-password --region "$REGION" \
            | ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes \
                "${EC2_USER}@${EC2_HOST}" \
                "docker login --username AWS --password-stdin ${REGISTRY}"

          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "IMAGE='${IMAGE}' TAG='${TAG}' CONTAINER_NAME='${CONTAINER_NAME}' \
             HOST_PORT='${HOST_PORT}' CONTAINER_PORT='${CONTAINER_PORT}' \
             ENV_DIR='${ENV_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail

          docker pull "${IMAGE}:${TAG}"

          if [ ! -f "${ENV_DIR}/.env" ]; then
            echo "ERROR: missing ${ENV_DIR}/.env on EC2"
            exit 1
          fi

          docker stop "${CONTAINER_NAME}" 2>/dev/null || true
          docker rm "${CONTAINER_NAME}" 2>/dev/null || true

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            --env-file "${ENV_DIR}/.env" \
            -p "${HOST_PORT}:${CONTAINER_PORT}" \
            "${IMAGE}:${TAG}"

          docker image prune -f
          docker ps --filter "name=${CONTAINER_NAME}"
          REMOTE
